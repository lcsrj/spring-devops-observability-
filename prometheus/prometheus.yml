# =============================================================================
#  Prometheus - configuracao de scrape da stack local
#
#  A aplicacao expoe as metricas do Micrometer em /actuator/prometheus. O target
#  usa o nome do servico do Compose (app), resolvido pelo DNS interno da rede
#  Docker - nao depende de IP nem de configuracao manual.
# =============================================================================
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    monitor: spring-devops-observability
    stack: local-lab

scrape_configs:
  # -------------------------------------------------------------------------
  # Aplicacao Spring Boot (alvo principal da avaliacao)
  # -------------------------------------------------------------------------
  - job_name: spring-boot-app
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_interval: 5s
    static_configs:
      - targets:
          - app:8080
        labels:
          service: spring-devops-observability
          component: application

  # -------------------------------------------------------------------------
  # Auto-monitoramento do proprio Prometheus (util para validar a coleta)
  # -------------------------------------------------------------------------
  - job_name: prometheus
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:9090
        labels:
          component: monitoring
