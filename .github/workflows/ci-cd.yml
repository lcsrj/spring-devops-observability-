name: CI/CD

# =============================================================================
#  Esteira DevSecOps do projeto
#
#  Gatilhos: push e pull_request na branch principal (main), alem de execucao
#  manual (workflow_dispatch).
#
#  Fluxo:
#    1. build-and-test  -> compila com JDK 21, roda a suite de testes
#    2. compose-lint    -> valida a sintaxe do docker-compose.yml
#    3. docker          -> constroi a imagem com o Dockerfile MULTISTAGE e,
#                          somente em push na main, publica no GHCR
#    4. security-scan   -> varreduras Trivy (dependencias e imagem)
#
#  Decisao de projeto: a PUBLICACAO no GHCR acontece apenas em push na `main`.
#  Em Pull Requests a imagem e construida e validada, mas nao publicada, porque
#  o GITHUB_TOKEN de PRs vindos de forks e somente-leitura para packages - o job
#  falharia por permissao, nao por qualidade do codigo.
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissoes minimas necessarias: ler o codigo e escrever pacotes (GHCR).
permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  TRIVY_VERSION: '0.74.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  #  1. Compilacao e testes automatizados
  # ===========================================================================
  build-and-test:
    name: Build e testes (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      app-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin) com cache do Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ler a versao do projeto no pom.xml
        id: version
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versao do artefato: ${VERSION}"

      - name: Compilar o projeto
        run: mvn -B -ntp clean compile

      - name: Executar os testes
        run: mvn -B -ntp test

      - name: Empacotar o artefato
        run: mvn -B -ntp package -DskipTests

      - name: Publicar relatorios de teste como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Publicar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/app.jar
          retention-days: 7

  # ===========================================================================
  #  2. Validacao da orquestracao local
  # ===========================================================================
  compose-lint:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Validar a sintaxe do Compose
        run: docker compose config --quiet

      - name: Conferir que todos os servicos obrigatorios existem
        run: |
          SERVICES=$(docker compose config --services | sort | tr '\n' ' ')
          echo "Servicos declarados: ${SERVICES}"
          for required in app prometheus grafana mongodb opensearch graylog graylog-init; do
            if ! echo "${SERVICES}" | grep -qw "${required}"; then
              echo "::error::servico obrigatorio ausente no Compose: ${required}"
              exit 1
            fi
            echo "  ok: ${required}"
          done

      - name: Conferir que nenhuma imagem usa a tag latest
        run: |
          if docker compose config | grep -E '^\s+image:.*:latest\s*$'; then
            echo "::error::ha imagens com tag latest - use versoes fixas"
            exit 1
          fi
          echo "ok: todas as imagens usam versoes fixas"

  # ===========================================================================
  #  3. Build da imagem Docker (multistage) e publicacao no GHCR
  # ===========================================================================
  docker:
    name: Imagem Docker e publicacao no GHCR
    runs-on: ubuntu-latest
    needs: [build-and-test, compose-lint]
    timeout-minutes: 30

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Normalizar o nome da imagem para minusculas
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A autenticacao so ocorre quando a publicacao e permitida (push na main).
      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build-and-test.outputs.app-version }},enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=DevOps Observability Control Center
            org.opencontainers.image.version=${{ needs.build-and-test.outputs.app-version }}

      # Em PR: build + load local (valida o Dockerfile multistage sem publicar).
      # Em push na main: build + push para o GHCR.
      - name: Construir a imagem com o Dockerfile multistage
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ---------------------------------------------------------------------
      # Prova automatizada de que o multistage funcionou: a imagem final nao
      # pode conter Maven, compilador nem codigo-fonte.
      # ---------------------------------------------------------------------
      - name: Validar que a imagem de runtime esta enxuta
        run: |
          set -euo pipefail
          # `sed -n 1p` em vez de `head -1`: o head encerra apos a primeira linha
          # e pode fechar o pipe antes do echo terminar, o que com `pipefail`
          # faria o step falhar mesmo estando tudo correto.
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" > /tmp/tags.txt; sed -n '1p' /tmp/tags.txt)
          echo "Validando ${IMAGE}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker pull "${IMAGE}"
          fi

          echo "--- conteudo de /app ---"
          docker run --rm --entrypoint sh "${IMAGE}" -c 'ls -lh /app'

          echo "--- ferramentas de build (devem estar ausentes) ---"
          FOUND=$(docker run --rm --entrypoint sh "${IMAGE}" -c \
            'for t in mvn javac jar; do command -v $t >/dev/null 2>&1 && echo -n "$t "; done' || true)
          if [ -n "${FOUND}" ]; then
            echo "::error::a imagem de runtime contem ferramentas de build: ${FOUND}"
            exit 1
          fi
          echo "ok: sem mvn/javac/jar"

          echo "--- codigo-fonte (deve estar ausente) ---"
          SRC=$(docker run --rm --entrypoint sh "${IMAGE}" -c \
            'find / -name "*.java" -o -name "pom.xml" 2>/dev/null | grep -v "^/proc" | wc -l')
          if [ "${SRC}" != "0" ]; then
            echo "::error::a imagem de runtime contem ${SRC} arquivo(s) de codigo-fonte"
            exit 1
          fi
          echo "ok: sem codigo-fonte na imagem final"

          echo "--- tamanho final ---"
          docker image inspect "${IMAGE}" --format 'imagem: {{.RepoTags}} / tamanho: {{.Size}} bytes'

      - name: Subir a aplicacao a partir da imagem e validar os endpoints
        run: |
          set -euo pipefail
          # Mesma precaucao do step anterior: a primeira tag e lida de um arquivo,
          # sem `echo | head`, que poderia falhar por Broken pipe com `pipefail`.
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" > /tmp/tags.txt; sed -n '1p' /tmp/tags.txt)
          docker run -d --name ci-app -p 8080:8080 "${IMAGE}"

          # IMPORTANTE: nenhuma checagem abaixo usa pipe.
          # Com `set -o pipefail`, um `curl | grep -q` (ou `echo | grep -q`)
          # falha mesmo quando o conteudo esta correto: o `grep -q` encerra no
          # primeiro match e fecha o pipe, e o processo da esquerda morre com
          # erro de escrita (Broken pipe). Por isso a resposta vai para arquivo
          # e o grep le o arquivo.
          echo "aguardando readiness..."
          for i in $(seq 1 45); do
            curl -sf http://localhost:8080/actuator/health/readiness -o /tmp/readiness.json || true
            if [ -s /tmp/readiness.json ] && grep -q '"status":"UP"' /tmp/readiness.json; then
              echo "aplicacao pronta apos ${i} tentativa(s)"
              break
            fi
            sleep 2
          done

          echo "--- validando endpoints ---"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          echo "  ok  GET /                      -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = "200"
          echo "  ok  GET /api/status            -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/demo/ok)" = "200"
          echo "  ok  GET /api/demo/ok           -> 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/demo/bad-request)" = "400"
          echo "  ok  GET /api/demo/bad-request  -> 400"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/demo/error)" = "500"
          echo "  ok  GET /api/demo/error        -> 500"
          curl -sf http://localhost:8080/actuator/prometheus -o /tmp/metrics.txt
          grep -q 'jvm_memory_used_bytes' /tmp/metrics.txt
          echo "  ok  /actuator/prometheus expoe metricas da JVM"
          grep -q 'http_server_requests_seconds_count' /tmp/metrics.txt
          echo "  ok  /actuator/prometheus expoe metricas HTTP"
          grep -q 'application="spring-devops-observability"' /tmp/metrics.txt
          echo "  ok  /actuator/prometheus aplica as tags comuns"

          docker rm -f ci-app

      - name: Resumo da publicacao
        run: |
          {
            echo "## Imagem Docker"
            echo ""
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Publicada no GHCR:"
            else
              echo "Construida e validada (nao publicada - evento \`${{ github.event_name }}\`):"
            fi
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  4. DevSecOps - varreduras de seguranca
  #
  #  Sao verificacoes ADICIONAIS: rodam em paralelo e nao bloqueiam a entrega
  #  dos requisitos obrigatorios (continue-on-error).
  # ===========================================================================
  security-scan:
    name: Varredura de seguranca (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # O Trivy roda pela IMAGEM OFICIAL, e nao pela action: a action depende do
      # sub-passo `setup-trivy`, que baixa o binario de release e falhou nesta
      # pipeline (`Cache not found` + exit 1). Usando a imagem, a versao fica
      # fixada e a varredura nao depende de download de asset externo.
      #
      # Divisao deliberada de responsabilidades entre as varreduras:
      #
      #   filesystem -> misconfig + segredos  (nao roda o analisador Java)
      #   image      -> vulnerabilidades      (cobre o SO da imagem E o .jar)
      #
      # O motivo: o comando `filesystem` roda o analisador Java ao percorrer os
      # arquivos, qualquer que seja o `--scanners`, e a resolucao dos POMs pai no
      # Maven Central falha com `429 Too Many Requests` a partir do runner (nem
      # `--offline-scan` nem `--skip-files` evitaram). Por isso a configuracao usa
      # o comando dedicado `trivy config`, que percorre apenas arquivos de
      # configuracao (Dockerfile, Compose, etc.), e as vulnerabilidades ficam no
      # scan da IMAGEM - que e o artefato publicado e carrega no .jar exatamente
      # as dependencias executadas em producao.
      #
      # `exit-code 0`: as varreduras sao ADICIONAIS e nao bloqueiam os
      # requisitos obrigatorios do projeto.
      # -----------------------------------------------------------------------
      - name: Trivy - misconfiguration do Dockerfile e do Compose
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan:ro" \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            config --severity CRITICAL,HIGH \
              --exit-code 0 /scan

      - name: Trivy - segredos no repositorio
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan:ro" \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            filesystem --scanners secret \
              --skip-files pom.xml \
              --exit-code 0 --no-progress /scan

      - name: Construir a imagem de runtime para varredura
        if: always()
        run: docker build -t scan-target:ci --target runtime .

      - name: Trivy - vulnerabilidades na imagem de runtime (SO + .jar)
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            image --scanners vuln \
              --severity CRITICAL,HIGH --ignore-unfixed \
              --offline-scan \
              --exit-code 0 --no-progress scan-target:ci
